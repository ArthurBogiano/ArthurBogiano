<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Arthur Bogiano — Offensive Security, Secure Software Engineering and Applied AI</title>
  <desc id="desc">A dark terminal window with AB ASCII art and a neofetch-style professional summary.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090711"/>
      <stop offset="0.55" stop-color="#100a1c"/>
      <stop offset="1" stop-color="#07130f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="0.52" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#39ff88"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#ffffff" stroke-opacity="0.025"/>
    </pattern>
  </defs>

  <rect x="2" y="2" width="1196" height="426" rx="18" fill="url(#bg)" stroke="#2c1c45" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="426" rx="18" fill="url(#scanlines)"/>

  <circle cx="30" cy="28" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="28" r="6" fill="#febc2e"/>
  <circle cx="70" cy="28" r="6" fill="#28c840"/>
  <text x="600" y="33" text-anchor="middle" fill="#867a99" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">arthur@webart3: ~/profile</text>
  <path d="M18 52H1182" stroke="#2a2037"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="50" y="110" fill="url(#accent)" font-size="35" font-weight="700" filter="url(#glow)">
      <tspan x="50" dy="0"> █████╗ ██████╗ </tspan>
      <tspan x="50" dy="43">██╔══██╗██╔══██╗</tspan>
      <tspan x="50" dy="43">███████║██████╔╝</tspan>
      <tspan x="50" dy="43">██╔══██║██╔══██╗</tspan>
      <tspan x="50" dy="43">██║  ██║██████╔╝</tspan>
      <tspan x="50" dy="43">╚═╝  ╚═╝╚═════╝ </tspan>
    </text>

    <text x="63" y="385" fill="#39ff88" font-size="16">[ AUTHORIZED SECURITY RESEARCH ]</text>

    <text x="525" y="92" fill="#f3effa" font-size="22" font-weight="700">arthur@bogiano</text>
    <text x="525" y="116" fill="#5b4e6c" font-size="16">────────────────────────────────────────────────────</text>

    <text x="525" y="151" font-size="17">
      <tspan fill="#a855f7">role</tspan>
      <tspan fill="#4f435f"> ........ </tspan>
      <tspan fill="#e7e1ef">Ethical Hacker &amp; Secure Software Developer</tspan>
    </text>
    <text x="525" y="187" font-size="17">
      <tspan fill="#a855f7">focus</tspan>
      <tspan fill="#4f435f"> ....... </tspan>
      <tspan fill="#e7e1ef">Offensive Security / AppSec / Applied AI</tspan>
    </text>
    <text x="525" y="223" font-size="17">
      <tspan fill="#a855f7">stack</tspan>
      <tspan fill="#4f435f"> ....... </tspan>
      <tspan fill="#e7e1ef">Python · TypeScript · Node.js · Linux</tspan>
    </text>
    <text x="525" y="259" font-size="17">
      <tspan fill="#a855f7">company</tspan>
      <tspan fill="#4f435f"> ..... </tspan>
      <tspan fill="#e7e1ef">WebArt3 — secure software &amp; automation</tspan>
    </text>
    <text x="525" y="295" font-size="17">
      <tspan fill="#a855f7">location</tspan>
      <tspan fill="#4f435f"> .... </tspan>
