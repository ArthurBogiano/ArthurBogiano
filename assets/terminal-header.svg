    </text>

    <text x="525" y="343" font-size="17">
      <tspan fill="#39ff88">$</tspan>
      <tspan fill="#c8bed5"> ./mindset --current</tspan>
    </text>
    <text x="525" y="376" font-size="17">
      <tspan fill="#39ff88">[ACTIVE]</tspan>
      <tspan dx="9" fill="#e7e1ef">break assumptions. build safer systems.</tspan>
    </text>
    <rect x="1007" y="361" width="9" height="19" fill="#39ff88" opacity="0.9"/>
  </g>

  <rect x="18" y="413" width="1164" height="2" rx="1" fill="url(#accent)" opacity="0.8"/>
</svg>
